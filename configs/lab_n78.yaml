# Unified lab configuration: hardware by default, single active cell A + X310 UE C.
# Hardware B (192.168.20.6) stays inactive. RFsim changes mode, not the PHY.
# Commands: docs/EXPERIMENT_COMMANDS.txt. Concepts: docs/CONCEPTS.md.
# Authorization range/power are operator statements (2026-11-09), not independently verified.
# Current carrier 3604.8 MHz has nominal channel edges 3599.8--3609.8 MHz.
# VERT2450 antennas are not specified for n78. Antenna suitability remains to be qualified.
# UE link enx9c69d381261e: NetworkManager profile oaiho-ue-x310, host 192.168.10.11/32.
# UE 192.168.10.5 answered on that dedicated link on 2026-11-11.
# Original cell link enx00e04c680014 restored on 2026-11-11; use scripts/usrp_link_up.sh after reconnect.
# nic_du1 remains a PLANNED future link; concurrent full-rate RX failed qualification.
# Live hardware stays blocked until power/coupling, antenna, clock and transport checks pass.
# auto power and ota geometry below are PLANNING ONLY. Do not approve them by changing flags.
# Cell TX attenuation 31 requests gain 0.5 dB; UE 31.5 requests gain 0 dB.
