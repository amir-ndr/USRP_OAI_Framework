# Two-X310 F1 handover bench (this lab). Automatic A3 trigger: move the UE between the two antenna sets.
# Hardware facts below come from this host and your probes: X310 A 192.168.10.2, X310 B 192.168.20.6,
# both UBX-160, both on the USB 5GbE adapter enx00e04c680014 (linked at 1 GbE), OctoClock 192.168.10.3.
# Fields marked TODO must be filled before `oaiho validate ... --live` passes. Read docs/RUNBOOK.md.
schema_version: 2
mode: hardware
topology: f1
experiment:
  name: bench_f1_a3
  repetition: 0
  seed: 1
paths:
  oai_root: /home/amirndr/openairinterface5g
  nr_softmodem: /home/amirndr/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem
  nr_uesoftmodem: /home/amirndr/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem
  ue_uicc_config: /home/amirndr/nrue.uicc.conf
  uhd_prefix: /usr/local            # UHD 4.11 (matches the radios' FPGA images); ignore the apt 4.6 copy
host:
  links:
    # Both radios share this link: two 7.68 MS/s sc16 streams = ~521 Mbit/s per direction.
    enx00e04c680014: {mbps: 1000, max_utilization: 0.7}
clock:
  octoclock_ip: 192.168.10.3
plmn:                               # must match ~/oai-cn5g/conf/config.yaml and the SIM
  mcc: '001'
  mnc: '01'
  tac: 1
  sst: 1
  sd: null
core:
  amf_ip: 192.168.70.132
cu:
  gnb_id: 3584
  f1_ip: 127.0.0.3
  n2_ip: 192.168.70.129/24          # this host's address on the oai-cn5g docker bridge
  n3_ip: 192.168.70.129/24
  telnet_ip: 127.0.0.2
  telnet_port: 9090
radio:
  # 5 MHz FDD, DL 2152.68 MHz / UL 1752.68 MHz, 7.68 MS/s. The only profile whose two streams fit
  # one 1 GbE link. n78_24prb_30khz (10 MHz TDD) needs one NIC per radio; n78_106prb_30khz needs 10 GbE.
  profile: n66_25prb_15khz
  clock_source: external
  time_source: external
  continuous_tx: false
  # Template value is -118 dBm. The 30 dB pad on RX2 attenuates only the uplink, so the UE is asked
  # to aim 18 dB higher. Harmless for RX safety: the UE is still capped by safety.ue_pmax_dbm.
  prach_target_dbm: -100
security:                            # AS algorithms the CU offers; the first one the UE supports wins
  ciphering: [nea0]
  integrity: [nia2, nia0]
  drb_ciphering: true
  drb_integrity: false
ue:
  kind: cots_modem                   # cots_modem | iphone | oai_nrue | other
handover:
  trigger: a3                        # CU hands over when the UE reports neighbour > serving + offset + hysteresis for TTT
  periodic_reports: true             # UE also reports RSRP every 1024 ms (dashboard)
  offset_db: 3.0
  hysteresis_db: 1.0
  ttt_ms: 160
cells:
- name: du0
  pci: 0
  nr_cellid: 12345678
  du_id: 3584
  gnb_id: 3584
  f1_ip: 127.0.0.4
  n2_ip: 192.168.70.129/24
  n3_ip: 192.168.70.129/24
  ssb_bitmap: 1                      # SSB index 0 (4 SSB positions in this FDD profile)
  usrp_ip: 192.168.10.2
  usrp_link: enx00e04c680014
  serial: 34BA717                    # uhd_usrp_probe 2026-11-09
  daughterboard: UBX-160 v2
  subdev: B:0                        # UBX-160 v2 sits in slot B (Radio#1); slot A is empty
  att_tx_db: 31                      # UHD TX gain = 31.5 - 31 = 0.5 dB (minimum useful). Step down 3 dB at a time.
  att_rx_db: 0
  max_rxgain: 110                    # UHD RX gain = 110 - 0 - 82 (X310 cal at 1.75 GHz) = 28 dB
  tx_gain_min_db: 0.0                # UBX-160 range reported by uhd_usrp_probe; verify against yours
  tx_gain_max_db: 31.5
  rx_gain_min_db: 0.0
  rx_gain_max_db: 31.5
  telnet_ip: 127.0.0.4
  telnet_port: 9090
- name: du1
  pci: 1
  nr_cellid: 11111111
  du_id: 3585
  gnb_id: 3585
  f1_ip: 127.0.0.5
  n2_ip: 192.168.70.129/24
  n3_ip: 192.168.70.129/24
  ssb_bitmap: 2                      # SSB index 1: different symbols from du0
  usrp_ip: 192.168.20.6
  usrp_link: enx00e04c680014
  serial: 34BA72C                    # uhd_usrp_probe 2026-11-09
  daughterboard: UBX-160 v2
  subdev: B:0                        # UBX-160 v2 sits in slot B (Radio#1); slot A is empty
  att_tx_db: 31
  att_rx_db: 0
  max_rxgain: 110
  tx_gain_min_db: 0.0
  tx_gain_max_db: 31.5
  rx_gain_min_db: 0.0
  rx_gain_max_db: 31.5
  telnet_ip: 127.0.0.5
  telnet_port: 9090
rfsim:
  ue_server_ip: 127.0.0.1
  port: 4043
rfsim_channel:
  enabled: false
  model: AWGN
  ploss_db: 0.0
  noise_power_db: -80.0
  forgetfact: 0.0
  offset_samples: 0
  ds_tdl: 0.03
attenuator:
  adapter_argv: []
  readback_qualified: false
  min_db: 0
  max_db: 60
  safe_db: 60
  minimum_interval_s: 1.0
  maximum_lateness_s: 0.5
  timeout_s: 3.0
safety:
  rf_setup: ota                      # antennas on a bench (no RF cables between devices)
  max_uhd_tx_gain_db: 6.0            # hard cap: validate/render refuse more; the runner kills a DU that reports more
  ue_pmax_dbm: 0                     # broadcast p-Max: the UE may not transmit above 0 dBm (shown live as PCMAX)
  # Set each flag to true ONLY after doing the check in docs/RUNBOOK.md (step 5-7).
  rf_path_reviewed: false            # 30 dB pads fitted on both RX2 ports, distances respected, budget reviewed
  spectrum_authorized: false         # licence for 2150/1750 MHz radiation, or a shielded enclosure
  clock_and_pps_verified: true       # oaiho clock-check --execute passed 2026-11-09 (both ref_locked, same PPS epoch)
  host_time_synchronized: false      # chrony/NTP in sync (single host: still check `chronyc tracking`)
  single_cell_attach_verified: false # each cell alone carried a UE data session
  gain_mapping_verified: false       # DU logs showed Actual TX/RX gain = expected (`oaiho gains`)
  evidence_note: ''                  # TODO: where your photos/measurements/notes are kept
  receivers:
  # ASSUMPTIONS to verify (bench geometry from docs/RF_SAFETY.md): 30 dB SMA attenuator on each RX2 port,
  # antennas <= 3 dBi, the two radios' antennas >= 2 m apart, the UE >= 1 m from every antenna.
  # Cell transmitters are budgeted at the TX-gain CAP ('auto'); the UE at its hardware maximum (no pMax credit).
  - name: du0
    max_input_dbm: -15.0
    margin_db: 10.0
    limit_source: Ettus UBX maximum RF input -15 dBm (kb.ettus.com/UBX)
    paths:
    - source: du0
      source_peak_dbm: auto
      minimum_passive_loss_db: 40.0
      uncertainty_db: 3.0
      evidence: ASSUMPTION own TX/RX antenna to RX2 antenna coupling >= 10 dB (a few cm apart) + 30 dB pad on RX2
    - source: du1
      source_peak_dbm: auto
      ota: {distance_m: 2.0, tx_antenna_gain_dbi: 3.0, rx_antenna_gain_dbi: 3.0}
      fixed_pad_db: 30.0
      minimum_passive_loss_db: null
      uncertainty_db: 3.0
      evidence: ASSUMPTION radios' antennas >= 2 m apart; 30 dB pad on RX2
    - source: ue
      source_peak_dbm: 23.0
      ota: {distance_m: 1.0, tx_antenna_gain_dbi: 0.0, rx_antenna_gain_dbi: 3.0}
      fixed_pad_db: 30.0
      minimum_passive_loss_db: null
      uncertainty_db: 3.0
      evidence: ASSUMPTION power-class-3 UE at 23 dBm hardware max kept >= 1 m away; 30 dB pad on RX2
  - name: du1
    max_input_dbm: -15.0
    margin_db: 10.0
    limit_source: Ettus UBX maximum RF input -15 dBm (kb.ettus.com/UBX)
    paths:
    - source: du1
      source_peak_dbm: auto
      minimum_passive_loss_db: 40.0
      uncertainty_db: 3.0
      evidence: ASSUMPTION own TX/RX antenna to RX2 antenna coupling >= 10 dB (a few cm apart) + 30 dB pad on RX2
    - source: du0
      source_peak_dbm: auto
      ota: {distance_m: 2.0, tx_antenna_gain_dbi: 3.0, rx_antenna_gain_dbi: 3.0}
      fixed_pad_db: 30.0
      minimum_passive_loss_db: null
      uncertainty_db: 3.0
      evidence: ASSUMPTION radios' antennas >= 2 m apart; 30 dB pad on RX2
    - source: ue
      source_peak_dbm: 23.0
      ota: {distance_m: 1.0, tx_antenna_gain_dbi: 0.0, rx_antenna_gain_dbi: 3.0}
      fixed_pad_db: 30.0
      minimum_passive_loss_db: null
      uncertainty_db: 3.0
      evidence: ASSUMPTION power-class-3 UE at 23 dBm hardware max kept >= 1 m away; 30 dB pad on RX2
  - name: ue
    max_input_dbm: -25.0
    margin_db: 6.0
    limit_source: 3GPP TS 38.101-1 maximum input level (an operating limit, used conservatively; not a damage rating)
    paths:
    - source: du0
      source_peak_dbm: auto
      ota: {distance_m: 1.0, tx_antenna_gain_dbi: 3.0, rx_antenna_gain_dbi: 0.0}
      minimum_passive_loss_db: null
      uncertainty_db: 3.0
      evidence: ASSUMPTION UE >= 1 m from the du0 TX/RX antenna
    - source: du1
      source_peak_dbm: auto
      ota: {distance_m: 1.0, tx_antenna_gain_dbi: 3.0, rx_antenna_gain_dbi: 0.0}
      minimum_passive_loss_db: null
      uncertainty_db: 3.0
      evidence: ASSUMPTION UE >= 1 m from the du1 TX/RX antenna
